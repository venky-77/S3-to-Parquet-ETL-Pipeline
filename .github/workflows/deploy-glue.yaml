name: Upload Glue Scripts to S3

# -------------------------------------------------
# Triggers
# -------------------------------------------------
on:
  push:
    branches:
      - master
    paths:
      - "glue-script/**"    # Only run when scripts change
  workflow_dispatch:        # Manual trigger

# -------------------------------------------------
# Job Definition
# -------------------------------------------------
jobs:
  upload:
    name: Upload Glue Scripts
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------
      # 2. Configure AWS credentials
      # ---------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------------------
      # 3. Upload Glue scripts to S3
      # ---------------------------------------------
      - name: Sync Glue scripts to S3
        run: |
          aws s3 sync glue-script/ \
          s3://storm-glue-scripts-2026/scripts/
